resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP sunucusu - Certbot doğrulaması ve HTTP → HTTPS yönlendirmesi
server {
    listen 80;
    server_name moretta.com.tr www.moretta.com.tr localhost 127.0.0.1;
    client_max_body_size 20m;

    # Certbot doğrulaması için .well-known yolunun erişime açık olması gerekir
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diğer istekleri HTTPS'e yönlendir
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS sunucusu
server {
    listen 443 ssl http2;
    server_name moretta.com.tr www.moretta.com.tr;
    client_max_body_size 20m;

    # SSL sertifikaları
    ssl_certificate /etc/letsencrypt/live/moretta.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moretta.com.tr/privkey.pem;

    # SSL konfigürasyonu (güvenli ayarlar)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS başlığı (opsiyonel, HTTPS'i zorunlu yapar)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        set $be backend:5010;
        proxy_pass http://$be;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $be backend:5010;
        proxy_pass http://$be;
    }

    location /admin/ {
        set $adm admin;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$adm;
        proxy_set_header Host $host;
    }

    location / {
        set $fe frontend;
        proxy_pass http://$fe;
        proxy_set_header Host $host;
    }
}
